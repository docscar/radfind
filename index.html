<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>RadFind — Radiology Learning</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #101827; color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    header { padding: 24px 18px; background: #172338; }
    h1 { margin: 0; color: #67e8f9; font-size: 30px; }
    header p { color: #bdc9da; margin-bottom: 0; }
    main { max-width: 850px; margin: auto; padding: 18px; }
    .search { display: flex; gap: 8px; }
    input, select, button {
      padding: 13px; border-radius: 10px; font-size: 15px;
    }
    input {
      min-width: 0; flex: 1; border: 1px solid #475569;
      background: #1e293b; color: white;
    }
    button {
      border: 0; background: #06b6d4; color: #08202a;
      font-weight: bold; cursor: pointer;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .chips button { background: #26364c; color: #e2e8f0; }
    select {
      width: 100%; margin: 4px 0 14px;
      background: #1e293b; color: white; border: 1px solid #475569;
    }
    #status { color: #cbd5e1; line-height: 1.5; }
    .results { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px; }
    .card { background: #1e293b; padding: 12px; border-radius: 14px; overflow: hidden; }
    .card img { width: 100%; height: 210px; object-fit: contain; background: #0b1220; border-radius: 8px; }
    .card h3 { font-size: 16px; line-height: 1.4; }
    .card a { color: #67e8f9; }
    .note { color: #94a3b8; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
<header>
  <h1>RadFind</h1>
  <p>Your radiology learning library</p>
</header>
<main>
  <h2>Find an image</h2>
  <div class="search">
    <input id="query" placeholder="e.g. pneumonia chest X-ray">
    <button onclick="searchImages()">Search</button>
  </div>

  <div class="chips">
    <button onclick="quick('chest X-ray')">Chest X-rays</button>
    <button onclick="quick('bone fracture X-ray')">Fractures</button>
    <button onclick="quick('CT brain')">CT brain</button>
    <button onclick="quick('brain MRI')">Brain MRI</button>
  </div>

  <label for="kind">Imaging type</label>
  <select id="kind">
    <option value="">All imaging types</option>
    <option value="X-ray">X-ray</option>
    <option value="CT">CT</option>
    <option value="MRI">MRI</option>
    <option value="ultrasound">Ultrasound</option>
  </select>

  <p id="status">Search open-access medical images to begin.</p>
  <div id="results" class="results"></div>

  <p class="note">
    Educational use only. Images and descriptions come from external medical
    resources. Always check the original source and its usage terms.
  </p>
</main>


<script>
const queryInput = document.getElementById('query');
const kindSelect = document.getElementById('kind');
const status = document.getElementById('status');
const results = document.getElementById('results');

function searchImages(term) {
  const query = (term === undefined ? queryInput.value : term).trim();

  if (!query) {
    status.textContent = 'Enter a topic or choose a shortcut.';
    return;
  }

  queryInput.value = query;
  const fullQuery = [query, kindSelect.value]
    .filter(Boolean).join(' ');
  const q = encodeURIComponent(fullQuery);

  results.replaceChildren();
  status.textContent = 'Choose a source to search for: ' + fullQuery;

  const sources = [
    {
      title: 'Google Images',
      description: 'Search medical images across the web.',
      url: 'https://www.google.com/search?tbm=isch&q=' + q
    },
    {
      title: 'Radiopaedia',
      description: 'Radiology cases and teaching explanations.',
      url: 'https://radiopaedia.org/search?lang=us&q=' + q
    },
    {
      title: 'MedPix — medical cases',
      description: 'Find medical teaching images through the NLM collection.',
      url: 'https://www.google.com/search?q=' +
        encodeURIComponent('site:medpix.nlm.nih.gov ' + fullQuery)
    },
    {
      title: 'PubMed Central figures',
      description: 'Search figures in free full-text medical articles.',
      url: 'https://www.google.com/search?q=' +
        encodeURIComponent(
          'site:pmc.ncbi.nlm.nih.gov/articles ' + fullQuery
        )
    },
    {
      title: 'Open-i — NLM',
      description: 'Try the original source again when it is available.',
      url: 'https://openi.nlm.nih.gov/?query=' + q
    }
  ];

  sources.forEach(source => {
    const card = document.createElement('article');
    card.className = 'card';

    const title = document.createElement('h3');
    title.textContent = source.title;

    const description = document.createElement('p');
    description.textContent = source.description;

    const link = document.createElement('a');
    link.href = source.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Open search';

    card.append(title, description, link);
    results.appendChild(card);
  });
}

document.querySelector('.search button')
  .addEventListener('click', () => searchImages());

queryInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') searchImages();
});

document.querySelectorAll('.chips button').forEach(button => {
  button.addEventListener('click', () => {
    const term = button.textContent === 'Chest X-rays'
      ? 'chest X-ray'
      : button.textContent === 'Fractures'
      ? 'bone fracture X-ray'
      : button.textContent === 'CT brain'
      ? 'CT brain'
      : button.textContent === 'Brain MRI'
      ? 'brain MRI'
      : button.textContent;
    searchImages(term);
  });
});
</script>
</body>
</html>

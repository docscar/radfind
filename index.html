<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>RadFind — Radiology Learning</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #101827; color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    header { padding: 24px 18px; background: #172338; }
    h1 { margin: 0; color: #67e8f9; font-size: 30px; }
    header p { color: #bdc9da; margin-bottom: 0; }
    main { max-width: 850px; margin: auto; padding: 18px; }
    .search { display: flex; gap: 8px; }
    input, select, button {
      padding: 13px; border-radius: 10px; font-size: 15px;
    }
    input {
      min-width: 0; flex: 1; border: 1px solid #475569;
      background: #1e293b; color: white;
    }
    button {
      border: 0; background: #06b6d4; color: #08202a;
      font-weight: bold; cursor: pointer;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .chips button { background: #26364c; color: #e2e8f0; }
    select {
      width: 100%; margin: 4px 0 14px;
      background: #1e293b; color: white; border: 1px solid #475569;
    }
    #status { color: #cbd5e1; line-height: 1.5; }
    .results { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px; }
    .card { background: #1e293b; padding: 12px; border-radius: 14px; overflow: hidden; }
    .card img { width: 100%; height: 210px; object-fit: contain; background: #0b1220; border-radius: 8px; }
    .card h3 { font-size: 16px; line-height: 1.4; }
    .card a { color: #67e8f9; }
    .note { color: #94a3b8; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
<header>
  <h1>RadFind</h1>
  <p>Your radiology learning library</p>
</header>
<main>
  <h2>Find an image</h2>
  <div class="search">
    <input id="query" placeholder="e.g. pneumonia chest X-ray">
    <button onclick="searchImages()">Search</button>
  </div>

  <div class="chips">
    <button onclick="quick('chest X-ray')">Chest X-rays</button>
    <button onclick="quick('bone fracture X-ray')">Fractures</button>
    <button onclick="quick('CT brain')">CT brain</button>
    <button onclick="quick('brain MRI')">Brain MRI</button>
  </div>

  <label for="kind">Imaging type</label>
  <select id="kind">
    <option value="">All imaging types</option>
    <option value="X-ray">X-ray</option>
    <option value="CT">CT</option>
    <option value="MRI">MRI</option>
    <option value="ultrasound">Ultrasound</option>
  </select>

  <p id="status">Search open-access medical images to begin.</p>
  <div id="results" class="results"></div>

  <p class="note">
    Educational use only. Images and descriptions come from external medical
    resources. Always check the original source and its usage terms.
  </p>
</main>

<script>
async function searchImages() {
  const query = document.getElementById('query').value.trim();
  const kind = document.getElementById('kind').value;
  const status = document.getElementById('status');
  const results = document.getElementById('results');

  if (!query) {
    status.textContent = 'Enter a topic or choose one of the shortcuts.';
    return;
  }

  const fullQuery = [query, kind].filter(Boolean).join(' ');
  status.textContent = 'Searching the open-access medical image library…';
  results.replaceChildren();

  try {
    const url = 'https://openi.nlm.nih.gov/api/search?' +
      new URLSearchParams({ query: fullQuery, m: '1', n: '20' });

    const response = await fetch(url);
    if (!response.ok) throw new Error('Search unavailable');

    const data = await response.json();
    const items = data.list || data.images || data.results || [];

    if (!items.length) throw new Error('No results');

    items.forEach(item => {
      const imageUrl = item.image || item.image_url || item.imgLarge ||
        item.imgSmall || item.fulltext_html_url;
      if (!imageUrl || !/^https?:\/\//i.test(imageUrl)) return;

      const card = document.createElement('article');
      card.className = 'card';

      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = item.caption || item.title || 'Medical image';
      img.loading = 'lazy';
      img.onerror = () => img.style.display = 'none';
      card.appendChild(img);

      const title = document.createElement('h3');
      title.textContent = item.caption || item.title || 'Medical image';
      card.appendChild(title);

      const link = document.createElement('a');
      link.href = item.fulltext_html_url || item.link || imageUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Open original source';
      card.appendChild(link);
      results.appendChild(card);
    });

    if (!results.children.length) throw new Error('No displayable images');
    status.textContent = 'Results for: ' + fullQuery;
  } catch (error) {
    status.textContent =
      'The image API could not load inside the app. You can still search the medical image library directly:';
    const link = document.createElement('a');
    link.href = 'https://openi.nlm.nih.gov/search?q=' + encodeURIComponent(fullQuery);
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Search Open-i for "' + fullQuery + '"';
    results.appendChild(link);
  }
}

function quick(term) {
  document.getElementById('query').value = term;
  searchImages();
}

document.getElementById('query').addEventListener('keydown', event => {
  if (event.key === 'Enter') searchImages();
});
</script>
</body>
</html>
